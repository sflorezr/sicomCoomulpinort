apply plugin: 'java'

group 'com.sergio'
version '1.0-SNAPSHOT'
sourceCompatibility = 17
targetCompatibility = 17
repositories {
    mavenCentral()
    flatDir {
        dirs 'lib'
    }
}
configurations {
    // configuration that holds jars to include in the jar
    extraLibs
}
dependencies {

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    implementation 'com.mashape.unirest:unirest-java:1.4.9'
    implementation group: 'org.json', name: 'json', version: '20180813'
    implementation group: 'com.squareup.okhttp3', name: 'okhttp', version: '4.0.0'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.5'
    implementation group: 'org.jsoup', name: 'jsoup', version: '1.14.2'
    implementation name: 'jaybird-full-2.2.12'    
    implementation group: 'net.iharder', name: 'base64', version: '2.3.8'
   // implementation name: 'Nomelectronica'
   // implementation name: 'factElectronicaGeneral_'
   // configurations.compile.extendsFrom(extraLibs)
    implementation group: 'com.googlecode.json-simple', name: 'json-simple', version: '1.1'
    implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.1'
    implementation group: 'javax.mail', name: 'mail', version: '1.4.7'
    implementation group: 'com.microsoft.sqlserver', name: 'mssql-jdbc', version: '8.2.2.jre8'
    implementation group: 'jakarta.mail', name: 'jakarta.mail-api', version: '2.1.2'

}

test {
    useJUnitPlatform()
}

jar {
    from {
        configurations.extraLibs.collect { it.isDirectory() ? it : zipTree(it) }
    }
    manifest {
        attributes "Main-Class": "com.sergio.prueba.inicio"
       // attributes 'Class-Path' : configurations.compile.collect { 'lib/' + it.getName() }.join(' ')
    }

}
// Jar ejecutable de la carga de ventas Caes a TNS con todas las librerias incluidas.
// Se genera con: gradlew caesJar  (queda en build/libs/CaesVentas.jar)
task caesJar(type: Jar) {
    archiveBaseName = 'CaesVentas'
    archiveVersion = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes "Main-Class": "com.test.java.com.sergio.facelectronica.consularVentasEDSCaes"
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
